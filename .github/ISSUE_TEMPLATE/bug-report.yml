name: API or website bug
description: Report reproducible incorrect behavior in Open Economics.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Open Economics. Do not include secrets or personal data.
  - type: input
    id: endpoint
    attributes:
      label: Affected URL or page
      placeholder: https://open-economics-data.knbf982hkn.chatgpt.site/api/v1/...
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the timestamp and X-Request-Id when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: A curl command or short code sample is ideal.
    validations:
      required: true
